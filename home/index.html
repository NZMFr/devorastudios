<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { text-transform: lowercase; min-height: 100vh; font-family: 'Chakra Petch', sans-serif; color: #fff; background-color: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow-x: hidden; line-height: 1.6; }
#matrix-background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: #000; }
#battery-container { position: fixed; top: 20px; left: 20px; display: flex; align-items: center; gap: 10px; z-index: 10000; }
#battery-oval { width: 100px; height: 50px; background: rgba(255, 255, 255, 0.05); border-radius: 25px; border: 2px solid rgba(255, 255, 255, 0.2); padding: 5px; position: relative; overflow: hidden; transition: all 0.3s ease; }
#battery-oval:hover { border-color: rgba(255, 255, 255, 0.4); transform: scale(1.05); }
#battery-level { height: 100%; border-radius: 15px; transition: width 0.5s ease; background: linear-gradient(to right, #fff, #666); min-width: 5px; width: 100%; }
#battery-percent { font-family: 'Chakra Petch', monospace; font-size: 14px; color: #666; min-width: 40px; text-align: center; font-weight: 600; }
#battery-icon { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #000; opacity: 0; transition: all 0.3s ease; }
.charging #battery-icon { opacity: 1; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.2); } }
#clock-container { position: fixed; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.05); padding: 15px 20px; border-radius: 10px; font-family: 'Chakra Petch', monospace; color: #666; z-index: 10000; border: 2px solid rgba(255, 255, 255, 0.2); display: flex; flex-direction: column; align-items: center; gap: 5px; transition: all 0.3s ease; cursor: pointer; }
#clock-container:hover { border-color: rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.08); }
#clock-time { font-size: 24px; letter-spacing: 2px; color: #fff; font-weight: 700; }
#clock-date { font-size: 14px; opacity: 0.6; transition: all 0.3s ease; }

#main-content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; width: 100%; max-width: 900px; padding: 30px 20px; margin: 140px auto 0; position: relative; z-index: 2; }
.title { font-size: 4em; margin-bottom: 10px; padding: 20px; color: #fff; white-space: nowrap; height: 1.2em; overflow: hidden; display: flex; align-items: center; justify-content: center; line-height: 1.2; text-transform: lowercase; letter-spacing: 8px; text-shadow: 0 0 20px rgba(255, 255, 255, 0.3); animation: titleGlow 3s ease-in-out infinite; }
@keyframes titleGlow { 0%, 100% { text-shadow: 0 0 20px rgba(255, 255, 255, 0.3); } 50% { text-shadow: 0 0 30px rgba(255, 255, 255, 0.5), 0 0 60px rgba(255, 255, 255, 0.2); } }
.typing-container { display: inline-block; min-height: 1.2em; }
.typing-cursor { display: inline-block; width: 4px; height: 0.8em; background: #fff; vertical-align: middle; margin-left: 8px; animation: blink 0.7s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
#quote { color: #666; font-size: 1.2rem; margin-top: 12px; margin-bottom: 30px; font-weight: 500; letter-spacing: 2px; max-width: 600px; line-height: 1.6; min-height: 3.6rem; transition: opacity 0.5s ease; font-style: italic; }
#quote.fade { opacity: 0; }
.stats-panel { position: fixed; bottom: 20px; right: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 16px 20px; z-index: 20; font-family: 'Chakra Petch', sans-serif; min-width: 200px; transition: all 0.3s ease; }
.stats-panel:hover { border-color: rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.08); }
.stats-panel h3 { margin: 0 0 12px 0; color: #666; font-size: 0.9rem; text-transform: lowercase; letter-spacing: 2px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px; }
.stat-row { display: flex; justify-content: space-between; margin: 8px 0; font-size: 0.9rem; }
.stat-label { color: #444; }
.stat-value { color: #888; font-weight: 600; }
.loading { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255, 255, 255, .3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.1); color: #fff; padding: 12px 20px; border-radius: 5px; z-index: 10001; opacity: 0; transition: opacity 0.3s ease; pointer-events: none; border: 1px solid rgba(255, 255, 255, 0.2); font-family: 'Chakra Petch', sans-serif; letter-spacing: 1px; }
.toast.show { opacity: 1; }
body.simple-background { background: #08090b; background-image: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.045), transparent 55%); }
body.simple-background #matrix-background, body.simple-background .particles { display:none; }
body.matrix-background #matrix-background { display:block; }
.particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: hidden; }
.particle { position: absolute; width: 2px; height: 2px; background: rgba(255, 255, 255, 0.3); border-radius: 50%; animation: float 15s infinite; }
@keyframes float { 0%, 100% { transform: translateY(100vh) translateX(0); opacity: 0; } 10% { opacity: 0.3; } 90% { opacity: 0.3; } 100% { transform: translateY(-10vh) translateX(50px); opacity: 0; } }

/* ===== GAMES SECTION ===== */
#games-section { width: 100%; max-width: 1100px; margin: 10px auto 90px; padding: 0 20px; position: relative; z-index: 2; }
.games-header { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; font-family: 'Orbitron', sans-serif; color: #888; letter-spacing: 8px; font-size: 1rem; text-transform: lowercase; }
.games-line { flex: 1; max-width: 200px; height: 1px; background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent); }
.games-scroll-hint { text-align: center; color: #333; font-size: 0.8rem; letter-spacing: 2px; margin-bottom: 15px; transition: color 0.3s ease; }
.games-controls { display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; margin:0 auto 12px; color:#999; font-size:.85rem; letter-spacing:1px; }
.games-controls button { min-width:38px; background:rgba(255,255,255,.05); color:#ddd; border:1px solid rgba(255,255,255,.2); border-radius:7px; padding:8px 13px; font:inherit; text-transform:lowercase; cursor:pointer; transition:background .2s,border-color .2s; }
.games-controls button:hover,.games-controls button.active { background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.55); color:#fff; }
.games-size-control { display:flex; align-items:center; gap:8px; padding:5px 8px; border:1px solid rgba(255,255,255,.16); border-radius:8px; }
.games-size-control button { font-size:1.15rem; line-height:1; padding:6px 10px; }
.games-size-control input { width:110px; accent-color:#bbb; cursor:pointer; }
.games-note { margin:12px auto 0; text-align:center; color:#666; font-size:.82rem; letter-spacing:1.4px; line-height:1.6; padding:0 12px; }
.games-scroll { --card-width:260px; --card-height:350px; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--card-width)),1fr)); gap:18px; overflow:visible; padding:18px 10px 30px; width:100%; }
.games-scroll.horizontal { display:grid; grid-auto-flow:column; grid-template-rows:repeat(var(--horizontal-rows,2),var(--card-height)); grid-auto-columns:var(--card-width); grid-template-columns:none; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory; scrollbar-width:thin; }
.games-scroll.horizontal .game-card { scroll-snap-align:start; }
.game-favorite { position:absolute; z-index:5; top:10px; right:10px; border:0; background:rgba(0,0,0,.65); color:#bbb; border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:16px; } .game-favorite.saved { color:#fff; }
.game-tag { position:absolute; z-index:4; top:12px; left:12px; padding:5px 9px; background:rgba(0,0,0,.84); color:#fff; border:1px solid rgba(255,255,255,.65); border-radius:4px; font-size:.65rem; letter-spacing:1px; }
.game-art img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:1; filter:none; transition:transform .4s; }
.game-card:hover .game-art img { transform:scale(1.05); }
.games-scroll::-webkit-scrollbar { height: 6px; }
.games-scroll::-webkit-scrollbar-track { background: transparent; }
.games-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
.games-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.35); }
.games-scroll.dragging { cursor: grabbing; scroll-snap-type: none; }
.game-card { scroll-snap-align:start; width:100%; height:var(--card-height); min-width:0; position:relative; perspective:800px; }
.game-card-inner { width: 100%; height: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; position: relative; transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease-out; transform-style: preserve-3d; }
.game-card:hover .game-card-inner { border-color: rgba(255,255,255,0.5); box-shadow: 0 0 30px rgba(255,255,255,0.12), 0 20px 40px rgba(0,0,0,0.6); }
.game-art { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01)); overflow: hidden; }
.game-art::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.25) 3px, rgba(0,0,0,0.25) 4px); pointer-events: none; }

.game-scanline { position: absolute; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.25); opacity: 0; top: 0; }
.game-card:hover .game-scanline { opacity: 1; animation: scanMove 1.5s linear infinite; }
@keyframes scanMove { 0% { top: -2px; } 100% { top: 100%; } }
.game-info { padding: 12px 14px 14px; border-top: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.4); }
.game-name { font-family: 'Orbitron', sans-serif; font-size: .95rem; font-weight: 700; letter-spacing: 3px; color: #fff; text-transform: lowercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.game-play { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; letter-spacing: 3px; color: #666; transition: all 0.3s ease; }
.game-card:hover .game-play { color: #fff; gap: 14px; }
.game-card:active .game-card-inner { transform: scale(0.97) !important; }

@media screen and (max-width: 900px) { .title { font-size: 2.5em; letter-spacing: 4px; } #clock-container { min-width: 150px; padding: 12px 16px; top: 100px; } #clock-time { font-size: 20px; } #clock-date { font-size: 12px; } #battery-container { top: 100px; } .stats-panel { display: none; } }
@media (max-width: 768px) { .title { font-size: 2em; letter-spacing: 3px; } #battery-oval { width: 80px; height: 40px; } #battery-percent { font-size: 12px; } #clock-container { min-width: 130px; padding: 10px 14px; } #clock-time { font-size: 18px; } #battery-container { top: 110px; left: 10px; } #clock-container { top: 110px; right: 10px; } #main-content { margin-top: 200px; } }
@media (max-width: 480px) { .games-controls { gap:6px; } .games-size-control input { width:80px; } .title { font-size: 1.5em; letter-spacing: 2px; } #clock-container { min-width: 100px; padding: 8px 12px; } #clock-time { font-size: 16px; } #clock-date { font-size: 10px; } .game-card { width: 220px; height: 310px; } }
</style>

<body>
<canvas id="matrix-background"></canvas>
<div class="particles" id="particles"></div>

<div id="battery-container">
    <div id="battery-oval">
        <div id="battery-level"></div>
        <i id="battery-icon" class="fas fa-bolt" aria-hidden="true"></i>
    </div>
    <span id="battery-percent">--%</span>
</div>

<div id="clock-container" onclick="toggleTimeFormat()">
    <div id="clock-time">00:00:00 AM</div>
    <div id="clock-date">Loading...</div>
</div>

<main id="main-content">
    <h1 class="title" id="title-element">
        <span class="typing-container" id="typing-text"></span>
        <span class="typing-cursor" aria-hidden="true"></span>
    </h1>

    <div id="quote">why are you reading this?</div>

</main>

<section id="games-section">
    <div class="games-header"><span class="games-line"></span> GAMES <span class="games-line"></span></div>
    <div class="games-controls" aria-label="game display settings">
        <button type="button" id="layout-grid" class="active" aria-pressed="true">portrait</button>
        <button type="button" id="layout-horizontal" aria-pressed="false">landscape</button>
        <div class="games-size-control" aria-label="game card size">
            <button type="button" id="size-down" aria-label="make game cards smaller">−</button>
            <input id="game-size" type="range" min="150" max="320" step="10" value="260" aria-label="game card size">
            <button type="button" id="size-up" aria-label="make game cards larger">+</button>

        <button type="button" id="reset-games">reset</button>

</section>

<div class="stats-panel">
    <h3>System Info</h3>
    <div class="stat-row">
        <span class="stat-label">Resolution:</span>
        <span class="stat-value" id="screen-res">--</span>
    </div>
    <div class="stat-row">
        <span class="stat-label">Platform:</span>
        <span class="stat-value" id="platform">--</span>
    </div>

        <span class="stat-label">Cores:</span>
        <span class="stat-value" id="cpu-cores">--</span>
    </div>
    <div class="stat-row">
        <span class="stat-label">Memory:</span>
        <span class="stat-value" id="memory-usage">--</span>
    </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   EDIT YOUR GAMES HERE — just change the name and url.
   Add or remove lines, the cards build themselves.
   ============================================================ */
// edit the message shown under the games here.
const GAMES_NOTE_TEXT = "not all games have been added yet just wait";
// background style: "simple" for a calm dark background, or "matrix" for the animated effect.
const BACKGROUND_STYLE = "matrix";
const GAMES = [
    { name: "ARC", url: "https://sites.google.com/view/devorastudiox/DSGS/arc", image: "https://agar.cc/games/wp-content/uploads/2025/02/Ragdoll-Archers-unblocked.jpg", tag: "fianlly fixed lol" },
    { name: "drive mad", url: "https://sites.google.com/view/devorastudiox/DSGS/drive-mad", image: "", tag: "" },
    { name: "pixel siege", url: "https://example.com/pixel-siege", image: "file:///media/fuse/drivefs-9a837003d125592981c40f18c29aa922/root/images%20(44).jpeg", tag: "" },
    { name: "ghost protocol", url: "https://example.com/ghost-protocol", image: "", tag: "" },
    { name: "cube arena", url: "https://example.com/cube-arena", image: "", tag: "" },
    { name: "dark sector", url: "https://example.com/dark-sector", image: "", tag: "" }
];
/* ============================================================ */

document.body.classList.add(BACKGROUND_STYLE === 'matrix' ? 'matrix-background' : 'simple-background');
const canvas = document.getElementById('matrix-background');
const ctx = canvas.getContext('2d');
let cw, ch, columns, drops, fontSize = 16, letters;

function initMatrix() {
    cw = canvas.width = window.innerWidth;
    ch = canvas.height = window.innerHeight;
    fontSize = Math.max(14, Math.floor(Math.min(cw, ch) / 50));
    letters = 'DEVORA01▓▒░█▄▀■□▪▫';
    columns = Math.floor(cw / fontSize);
    drops = new Array(columns).fill(1);
    ctx.font = fontSize + 'px monospace';
}

initMatrix();
window.addEventListener('resize', initMatrix);

let lastTime = 0;
function matrixLoop(ts) {
    if (ts - lastTime < 33) { 
        requestAnimationFrame(matrixLoop); 
        return; 
    }
    lastTime = ts;

    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.fillRect(0, 0, cw, ch);

    ctx.fillStyle = '#1a1a1a';

    for (let i = 0; i < drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > ch && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }

    requestAnimationFrame(matrixLoop);
}
requestAnimationFrame(matrixLoop);

const fonts = [
    'Orbitron',
    'Press Start 2P',
    'Black Ops One',
    'Russo One',
    'Audiowide',
    'Syncopate',
    'Monoton',
    'Bungee',
    'Righteous',
    'Bebas Neue',
    'Anton',
    'Teko',
    'Oswald',
    'Barlow Condensed',
    'Saira Condensed',
    'Kanit',
    'Exo 2',
    'Chakra Petch',
    'Electrolize',
    'Geo',
    'Quantico',
    'Share Tech Mono',
    'Wallpoet',
    'Stalinist One',
    'Rajdhani'
];

const titleElement = document.getElementById('title-element');
const typingElement = document.getElementById('typing-text');
let fontIndex = 0;
let charIndex = 0;
let isDeleting = false;
let typingSpeed = 100;
let deleteSpeed = 40;
let endPause = 1500;
const text = "devora studios";

function typeWriter() {
    titleElement.style.fontFamily = fonts[fontIndex];

    if (isDeleting) {
        typingElement.textContent = text.substring(0, charIndex - 1);
        charIndex--;
        if (charIndex === 0) {
            isDeleting = false;
            fontIndex = (fontIndex + 1) % fonts.length;
            setTimeout(typeWriter, 300);
        } else {
            setTimeout(typeWriter, deleteSpeed);
        }
    } else {
        typingElement.textContent = text.substring(0, charIndex + 1);
        charIndex++;
        if (charIndex === text.length) {
            isDeleting = true;
            setTimeout(typeWriter, endPause);
        } else {
            setTimeout(typeWriter, typingSpeed);
        }
    }
}

function updateBattery() {
    if ('getBattery' in navigator) {
        navigator.getBattery().then(function(battery) {
            function updateAll() {
                const level = Math.floor(battery.level * 100);
                document.getElementById('battery-percent').textContent = `${level}%`;
                document.getElementById('battery-level').style.width = `${level}%`;

                const batteryOval = document.getElementById('battery-oval');

                if (battery.charging) {
                    batteryOval.classList.add('charging');
                } else {
                    batteryOval.classList.remove('charging');
                }
            }
            updateAll();
            battery.addEventListener('levelchange', updateAll);
            battery.addEventListener('chargingchange', updateAll);
        }).catch(e => document.getElementById('battery-container').style.display = 'none');
    } else {
        document.getElementById('battery-container').style.display = 'none';
    }
}

let is24Hour = false;
function updateClock() {
    const now = new Date();
    const timeElement = document.getElementById('clock-time');
    const dateElement = document.getElementById('clock-date');

    let hours = now.getHours();
    const minutes = now.getMinutes().toString().padStart(2, '0');
    const seconds = now.getSeconds().toString().padStart(2, '0');

    if (is24Hour) {
        timeElement.textContent = `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`;
    } else {
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        timeElement.textContent = `${hours}:${minutes}:${seconds} ${ampm}`;
    }

    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

    dateElement.textContent = now.toLocaleDateString('en-US', {weekday:'long',month:'long',day:'numeric',year:'numeric'}).toLowerCase();
}

function toggleTimeFormat() {
    is24Hour = !is24Hour;
    updateClock();
    showToast(is24Hour ? '24-hour format' : '12-hour format');
}

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
}

function createParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 20; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 15 + 's';
        particle.style.animationDuration = (10 + Math.random() * 10) + 's';
        container.appendChild(particle);
    }
}

function updateStats() {
    document.getElementById('screen-res').textContent = `${window.screen.width}x${window.screen.height}`;
    document.getElementById('platform').textContent = navigator.platform || 'Unknown';
    document.getElementById('cpu-cores').textContent = navigator.hardwareConcurrency || 'Unknown';

    if (performance && performance.memory) {
        const used = (performance.memory.usedJSHeapSize / 1048576).toFixed(0);
        const total = (performance.memory.jsHeapSizeLimit / 1048576).toFixed(0);
        document.getElementById('memory-usage').textContent = `${used}MB`;
    } else {
        document.getElementById('memory-usage').textContent = 'N/A';
    }
}

/* ===== games: player-controlled layout and size ===== */
let gamesLayout='grid', gameCardWidth=260;
function updateGamesLayout(){
 const box=document.getElementById('games-scroll');
 document.getElementById('games-note').textContent=GAMES_NOTE_TEXT;
 const rows=Math.max(1,Math.min(5,Math.floor((window.innerHeight-260)/(gameCardWidth*1.34))));
 box.classList.toggle('horizontal',gamesLayout==='horizontal');
 box.style.setProperty('--card-width',gameCardWidth+'px');
 box.style.setProperty('--card-height',Math.round(gameCardWidth*1.34)+'px');
 box.style.setProperty('--horizontal-rows',rows);
 document.getElementById('layout-grid').classList.toggle('active',gamesLayout==='grid');
 document.getElementById('layout-horizontal').classList.toggle('active',gamesLayout==='horizontal');
 document.getElementById('layout-grid').setAttribute('aria-pressed',String(gamesLayout==='grid'));
 document.getElementById('layout-horizontal').setAttribute('aria-pressed',String(gamesLayout==='horizontal'));
 document.getElementById('games-scroll-hint').textContent=gamesLayout==='grid'?'browse the collection':'scroll to explore more games';
}
function renderGames(){
 const box=document.getElementById('games-scroll'); box.innerHTML='';
 GAMES.forEach(game=>{
  const card=document.createElement('div'); card.className='game-card';
  card.innerHTML=`<div class="game-card-inner"><div class="game-art"><button class="game-favorite" type="button" aria-label="save game" title="save game">♡</button>${game.tag?'<span class="game-tag"></span>':''}<span class="game-scanline"></span></div><div class="game-info"><div class="game-name"></div><div class="game-play">play <i class="fas fa-arrow-right"></i></div></div></div>`;
  card.querySelector('.game-name').textContent=game.name;
  const savedGames=JSON.parse(localStorage.getItem('devora-favorites')||'[]');
  const favorite=card.querySelector('.game-favorite');
  favorite.classList.toggle('saved',savedGames.includes(game.name)); favorite.textContent=savedGames.includes(game.name)?'♥':'♡';
  favorite.addEventListener('click',e=>{e.stopPropagation();const list=JSON.parse(localStorage.getItem('devora-favorites')||'[]');const i=list.indexOf(game.name);if(i>=0)list.splice(i,1);else list.push(game.name);localStorage.setItem('devora-favorites',JSON.stringify(list));favorite.classList.toggle('saved',i<0);favorite.textContent=i<0?'♥':'♡';showToast(i<0?'added to favorites':'removed from favorites');});
  if(game.tag) card.querySelector('.game-tag').textContent=game.tag;
  if(game.image){const img=document.createElement('img');img.src=game.image;img.alt=game.name+' artwork';img.loading='lazy';img.onerror=()=>img.remove();card.querySelector('.game-art').prepend(img);}
  card.addEventListener('click',()=>{if(game.url&&!game.url.includes('example.com'))window.open(game.url,'_blank','noopener');else showToast('add a working game link in the games settings');});
  const inner=card.querySelector('.game-card-inner');
  card.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect();inner.style.transform=`rotateX(${((e.clientY-r.top)/r.height-.5)*-7}deg) rotateY(${((e.clientX-r.left)/r.width-.5)*7}deg)`;});
  card.addEventListener('mouseleave',()=>inner.style.transform='rotateX(0deg) rotateY(0deg)');
  box.appendChild(card);
 }); updateGamesLayout();
}
function initGameControls(){
 document.getElementById('layout-grid').addEventListener('click',()=>{gamesLayout='grid';updateGamesLayout();});
 document.getElementById('layout-horizontal').addEventListener('click',()=>{gamesLayout='horizontal';updateGamesLayout();});
 const slider=document.getElementById('game-size');
 function setSize(value){gameCardWidth=Math.max(150,Math.min(320,value));slider.value=gameCardWidth;updateGamesLayout();}
 slider.addEventListener('input',()=>setSize(Number(slider.value)));
 document.getElementById('size-down').addEventListener('click',()=>setSize(gameCardWidth-20));
 document.getElementById('size-up').addEventListener('click',()=>setSize(gameCardWidth+20));
 document.getElementById('reset-games').addEventListener('click',()=>{gamesLayout='grid';setSize(260);showToast('display settings reset');});
 window.addEventListener('resize',updateGamesLayout);
}

function init() {
    updateClock();
    setInterval(updateClock, 1000);
    typeWriter();
    updateBattery();
    createParticles();
    updateStats();
    setInterval(updateStats, 2000);
    renderGames();
    initGameControls();
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
